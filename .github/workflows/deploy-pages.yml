name: Deploy to GitHub Pages

# 多環境部署（gh-pages 分支、每環境獨立、以子路徑區分）：
#   main  → gh-pages 根目錄 → /            （正式站 · PROD）
#   stage → gh-pages /stage  → /stage/      （預覽 · STAGE）
#   dev   → gh-pages /dev    → /dev/        （開發 · DEV，claude/salary-calculator-react-shadcn-stxjp7）
#
# 設計：推哪個分支就「只重建並只更新那個環境」，其餘子目錄以 keep_files 保留、完全不動。
# 因 Vite base 為相對路徑（"./"）＋ HashRouter，同一份 build 可掛任一子路徑，免逐環境改 base。
# Pages 來源需設為「Deploy from a branch：gh-pages / root」。
on:
  push:
    branches:
      - main
      - stage
      - claude/salary-calculator-react-shadcn-stxjp7
  workflow_dispatch:

# gh-pages 部署以 git push 寫入 gh-pages 分支，需 contents: write
permissions:
  contents: write

# 序列化對 gh-pages 分支的寫入，避免同時 push 衝突
concurrency:
  group: gh-pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve environment（依分支決定 APP_ENV 與 gh-pages 子目錄）
        id: env
        run: |
          case "${{ github.ref_name }}" in
            main)  echo "app_env=prod"  >> "$GITHUB_OUTPUT"; echo "dest=."     >> "$GITHUB_OUTPUT" ;;
            stage) echo "app_env=stage" >> "$GITHUB_OUTPUT"; echo "dest=stage" >> "$GITHUB_OUTPUT" ;;
            *)     echo "app_env=dev"   >> "$GITHUB_OUTPUT"; echo "dest=dev"   >> "$GITHUB_OUTPUT" ;;
          esac
          echo "已解析：分支=${{ github.ref_name }} → app_env / dest 如上"

      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci

      # 僅正式站（main）跑驗收測試把關；預覽環境求快，build 過即可。
      - name: Run acceptance tests (README §9)
        if: github.ref_name == 'main'
        run: npm test

      - name: Build（注入 APP_ENV）
        run: npm run build
        env:
          APP_ENV: ${{ steps.env.outputs.app_env }}

      # Storybook 是開發/設計工具、非終端使用者面向，且鐵律 10「Storybook-first」已保證元件在
      # dev 階段就驗證過才接到畫面 → 僅 dev 發佈 /dev/storybook；stage/main 跳過（省 build 時間、
      # 不對外供應開發工具）。停止發佈後舊的 /storybook、/stage/storybook 因 keep_files 殘留，已一次性清除。
      - name: Build Storybook（僅 dev 發佈 /dev/storybook）
        if: steps.env.outputs.app_env == 'dev'
        run: npm run build-storybook -- -o dist/storybook

      # 只把本環境的 dist 發佈到 gh-pages 的對應子目錄；keep_files 保留其他環境內容。
      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          destination_dir: ${{ steps.env.outputs.dest }}
          keep_files: true
          user_name: "github-actions[bot]"
          user_email: "github-actions[bot]@users.noreply.github.com"
          commit_message: "deploy ${{ steps.env.outputs.app_env }} @ ${{ github.sha }}"

  # 依 package.json 版號自動打 tag 並建立 GitHub Release（僅 main 推送、該版已存在則略過）。
  release:
    needs: deploy
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Tag & Release when version bumped
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER="$(sed -nE 's/.*"version" *: *"([^"]+)".*/\1/p' package.json | head -1)"
          TAG="v$VER"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "$TAG 已存在，略過。"
            exit 0
          fi
          NOTES="$(awk -v v="$VER" '/^## \[/{on=($0 ~ ("\\[" v "\\]"))} on' CHANGELOG.md)"
          [ -z "$NOTES" ] && NOTES="詳見 CHANGELOG.md"
          printf '%s\n' "$NOTES" > "$RUNNER_TEMP/notes.md"
          gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md"
          echo "已建立 Release $TAG"
