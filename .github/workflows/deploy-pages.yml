name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同時間僅允許一個部署，不取消進行中的正式部署
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run acceptance tests (README §9)
        run: npm test

      - name: Build
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # 依 package.json 版號自動打 tag 並建立 GitHub Release（該版已存在則略過）。
  # 版號 bump 時才會產生新 Release；發佈流程見 docs/versioning.md。
  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Tag & Release when version bumped
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER="$(sed -nE 's/.*"version" *: *"([^"]+)".*/\1/p' package.json | head -1)"
          TAG="v$VER"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "$TAG 已存在，略過。"
            exit 0
          fi
          NOTES="$(awk -v v="$VER" '/^## \[/{on=($0 ~ ("\\[" v "\\]"))} on' CHANGELOG.md)"
          [ -z "$NOTES" ] && NOTES="詳見 CHANGELOG.md"
          printf '%s\n' "$NOTES" > "$RUNNER_TEMP/notes.md"
          gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md"
          echo "已建立 Release $TAG（指向 $GITHUB_SHA）"
