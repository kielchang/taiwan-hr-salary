<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>台灣合規薪資計算系統（115 年）</title>
    <!-- 深色模式防閃爍：首次繪製前先套用 .dark（鍵與 src/lib/theme.ts 一致、不隨環境加後綴）。 -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("taiwan-hr-salary:theme") || "system";
          var dark = t === "dark" || (t === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) document.documentElement.classList.add("dark");
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
